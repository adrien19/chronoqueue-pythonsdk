version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: dev_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "securepassword123"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dev_network

networks:
  dev_network:
    driver: bridge

volumes:
  redis_data:
    driver: local