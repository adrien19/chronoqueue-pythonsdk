[tool.poetry]
name = "store-api"
version = "0.1.0"
description = "Example store API application using ChronoQueue Python SDK"
authors = ["ChronoQueue Team"]
readme = "README.md"
packages = [{include = "api"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pydantic = "^2.12.3"
chronoqueue = {path = "../..", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
