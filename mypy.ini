[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
no_implicit_optional = True

# Exclude generated protobuf code from type checking
exclude = (?x)(
    ^chronoqueue/api/
    )

# Ignore all errors from generated protobuf modules
[mypy-chronoqueue.api.*]
ignore_errors = True
follow_imports = skip

# Ignore protobuf-related type errors in main code
[mypy-chronoqueue.utils]
disable_error_code = attr-defined,assignment,var-annotated,union-attr

[mypy-chronoqueue.client]
disable_error_code = attr-defined,return,assignment,var-annotated

[mypy-chronoqueue.async_client]
disable_error_code = attr-defined,return,assignment,union-attr
